<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Lolly</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    (function () {
      const t = localStorage.getItem('lolly-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-base-200">
  <div class="w-full max-w-sm px-4">

    <div class="text-center mb-8">
      <div class="text-6xl mb-3">🍭</div>
      <h1 class="text-3xl font-bold text-base-content">Lolly</h1>
      <p class="text-base-content/40 text-sm mt-1">Personal Finance</p>
    </div>

    <div class="card bg-base-100 shadow-lg border border-base-300">
      <div class="card-body gap-4">

        {% if error %}
        <div class="alert alert-error py-2 text-sm">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login" class="space-y-4">
          <input type="hidden" name="next" value="{{ next }}">
          <div class="form-control">
            <label class="label"><span class="label-text font-medium">Passwort</span></label>
            <input type="password" name="password" required autofocus
                   class="input input-bordered w-full">
          </div>
          <button type="submit" class="btn btn-primary w-full">Anmelden</button>
        </form>
      </div>
    </div>

    <!-- Theme toggle -->
    <div class="text-center mt-5">
      <button onclick="toggleTheme()" class="btn btn-ghost btn-xs gap-1.5 text-base-content/40" id="theme-btn">
        ☀️ Hell
      </button>
    </div>
  </div>
  <script>
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('lolly-theme', next);
      document.getElementById('theme-btn').textContent = next === 'dark' ? '🌙 Dunkel' : '☀️ Hell';
    }
    const saved = localStorage.getItem('lolly-theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.getElementById('theme-btn').textContent = saved === 'dark' ? '🌙 Dunkel' : '☀️ Hell';
  </script>
</body>
</html>
