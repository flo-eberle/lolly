<!DOCTYPE html>
<html lang="de" data-theme="light" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Lolly{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script>
    // Apply saved theme before paint to avoid flash
    (function () {
      const t = localStorage.getItem('lolly-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    .amount-pos { color: oklch(var(--su)); font-weight: 600; }
    .amount-neg { color: oklch(var(--er)); font-weight: 600; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-flex; }
  </style>
</head>
<body class="min-h-screen flex bg-base-100">

  <!-- Sidebar -->
  <aside class="w-60 shrink-0 sticky top-0 h-screen flex flex-col bg-base-200 border-r border-base-300 overflow-y-auto">

    <!-- Logo -->
    <div class="px-5 py-5 border-b border-base-300">
      <div class="flex items-center gap-3">
        <span class="text-3xl leading-none">🍭</span>
        <div>
          <p class="font-bold text-base-content text-lg leading-none">Lolly</p>
          <p class="text-base-content/40 text-xs mt-0.5">Personal Finance</p>
        </div>
      </div>
    </div>

    <!-- Nav -->
    <ul class="menu menu-md px-3 py-4 flex-1 gap-0.5">
      <li>
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          Dashboard
        </a>
      </li>
      <li>
        <a href="/transactions/" class="{% if '/transactions' in request.url.path %}active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          Transaktionen
        </a>
      </li>
      <li>
        <a href="/accounts/" class="{% if '/accounts' in request.url.path %}active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
          </svg>
          Konten
        </a>
      </li>
      <li>
        <a href="/categories/" class="{% if '/categories' in request.url.path %}active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
          </svg>
          Kategorien
        </a>
      </li>
      <li>
        <a href="/settings/" class="{% if '/settings' in request.url.path %}active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          Einstellungen
        </a>
      </li>
    </ul>

    <!-- Bottom: theme toggle + logout -->
    <div class="px-3 py-3 border-t border-base-300 space-y-1">
      <label class="flex items-center gap-3 px-3 py-2 rounded-lg cursor-pointer hover:bg-base-300 transition-colors select-none">
        <input type="checkbox" id="theme-toggle" class="hidden" onchange="applyTheme(this.checked ? 'dark' : 'light')"/>
        <span id="theme-icon" class="text-base">☀️</span>
        <span class="text-sm font-medium text-base-content/70" id="theme-label">Hell</span>
      </label>
      <a href="/logout" class="flex items-center gap-3 px-3 py-2 rounded-lg text-error hover:bg-error/10 transition-colors text-sm font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Abmelden
      </a>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-y-auto min-h-screen">
    <div class="max-w-6xl mx-auto px-6 py-8">
      {% block content %}{% endblock %}
    </div>
  </main>

  <script>
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('lolly-theme', theme);
      const icon = document.getElementById('theme-icon');
      const label = document.getElementById('theme-label');
      const cb = document.getElementById('theme-toggle');
      if (icon) icon.textContent = theme === 'dark' ? '🌙' : '☀️';
      if (label) label.textContent = theme === 'dark' ? 'Dunkel' : 'Hell';
      if (cb) cb.checked = theme === 'dark';
    }
    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('lolly-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      applyTheme(saved);
    });
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
