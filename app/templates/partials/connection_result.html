{% if result.ok %}
<div class="alert alert-success py-2 text-sm mt-2">
  ✅ Verbindung erfolgreich! Gefundene Konten:
  {% for a in result.accounts %}<span class="font-mono ml-2">{{ a.iban }}</span>{% endfor %}
</div>
{% else %}
<div class="alert alert-error py-2 text-sm mt-2">
  ❌ {{ result.error }}
</div>
{% endif %}
